# Deploy to Railway PRODUCTION when a PR merges to main.
#
# How it works
#   - Trigger: a pull request CLOSED as MERGED into main (plus manual dispatch).
#   - A paths filter works out which services' source actually changed; only
#     those are deployed. Manual dispatch can force the full set.
#   - Each service is pushed with the Railway CLI (`railway up`) — exactly the
#     same mechanism used for staging deploys — against the PRODUCTION
#     environment, authenticated by a Railway PROJECT TOKEN.
#   - The `production` GitHub environment gates the job: add required reviewers
#     in repo Settings → Environments → production to get a manual approval
#     step before anything deploys.
#
# One-time setup (manual)
#   1. Railway dashboard → project idp-agentic-banking-demo → Settings →
#      Tokens → create a PROJECT token scoped to the "production" environment.
#   2. `gh secret set RAILWAY_PRODUCTION_TOKEN` with that value.
#   3. (Recommended) repo Settings → Environments → create "production" with
#      required reviewers.
#
# Deliberately EXCLUDED from CI (manual `railway up` only):
#   - pingfederate: its image build needs pf-pingone-mfa-integration-kit-4.0.zip,
#     which is licence-gated and gitignored (supplied to the build out-of-band),
#     so a CI checkout cannot build it. Deploy with:
#       railway up demo/pingfederate --path-as-root --service pingfederate \
#         --environment production --no-gitignore
#
# NOTE: production must actually HAVE a service before CI can deploy it. As of
# 2026-07-24 production still runs the older single-stack topology; services
# like accounts-api / payments-api / account-agent / proofing-directory must be
# created (with their env vars) in the production environment first.

name: Deploy to production

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Deploy ALL services regardless of changed paths"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    # Only run for merged PRs (not closed-without-merge) or manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          base: main
          # Filter names below are the deploy-matrix keys resolved in the
          # deploy job; keep the two in sync when adding a service.
          filters: |
            accounts-api:
              - 'demo/accounts-api/**'
            payments-api:
              - 'demo/payments-api/**'
            proofing-directory:
              - 'demo/proofing-directory/**'
            northwind-app:
              - 'demo/app/**'
            task-agents:
              - 'demo/task-agent/**'
            bank-agent:
              - 'demo/agent/**'
            authzen-adapter:
              - 'authzen-adapter/**'
            pingauthorize:
              - 'demo/pingauthorize/**'
            accounts-mcp:
              - 'demo/accounts-mcp/**'
            payments-mcp:
              - 'demo/payments-mcp/**'
            authzen-extauthz:
              - 'demo/coaz-pep/**'

  deploy:
    needs: changes
    if: needs.changes.outputs.services != '[]' || github.event.inputs.force_all == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      CHANGED: ${{ needs.changes.outputs.services }}
      FORCE_ALL: ${{ github.event.inputs.force_all || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy changed services
        run: |
          set -euo pipefail
          # filter-name -> one or more "service|upload-args" entries.
          # Upload shapes mirror the staging runbook:
          #   path-as-root services upload their own directory;
          #   repo-root services rely on RAILWAY_DOCKERFILE_PATH set on the service.
          # Each entry: one or more comma-separated "service|upload-args" pairs.
          # Empty args = repo-root upload (the service's RAILWAY_DOCKERFILE_PATH
          # points at its Dockerfile).
          declare -A DEPLOYS=(
            [accounts-api]="accounts-api|demo/accounts-api --path-as-root"
            [payments-api]="payments-api|demo/payments-api --path-as-root"
            [proofing-directory]="proofing-directory|demo/proofing-directory --path-as-root"
            [northwind-app]="northwind-app|demo/app --path-as-root"
            [task-agents]="account-agent|demo/task-agent --path-as-root,payments-agent|demo/task-agent --path-as-root"
            [bank-agent]="bank-agent|"
            [authzen-adapter]="authzen-adapter|"
            [pingauthorize]="pingauthorize|"
            [accounts-mcp]="accounts-mcp|demo/accounts-mcp --path-as-root"
            [payments-mcp]="payments-mcp|demo/payments-mcp --path-as-root"
            [authzen-extauthz]="authzen-extauthz|demo/coaz-pep --path-as-root"
          )
          if [ "$FORCE_ALL" = "true" ]; then
            keys="${!DEPLOYS[@]}"
          else
            keys=$(echo "$CHANGED" | jq -r '.[]')
          fi
          rc=0
          for key in $keys; do
            entry="${DEPLOYS[$key]:-}"
            [ -z "$entry" ] && { echo "::warning::no deploy mapping for filter '$key'"; continue; }
            IFS=',' read -ra pairs <<< "$entry"
            for pair in "${pairs[@]}"; do
              svc="${pair%%|*}"; args="${pair#*|}"
              echo "── deploying $svc (${args:-repo root})"
              railway up $args --service "$svc" --environment production --ci || rc=1
            done
          done
          exit $rc
