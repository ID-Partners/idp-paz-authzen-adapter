# Gateway swap: run the demo with agentgateway (solo.io) instead of Kong.
#
#   docker compose -f docker-compose.yml -f docker-compose.agentgateway.yml up --build
#
# Same topology, same PDP — only the gateway changes:
#   bank-agent ──DPoP──▶ agentgateway:/mcp  (PEP #1) ──▶ bank-mcp
#   bank-mcp   ──token─▶ agentgateway:/bank (PEP #2) ──▶ bank-api
#   both PEPs ──ext_authz(gRPC)──▶ coaz-pep ──AuthZEN──▶ authzen-adapter ──▶ Ping Authorize
#
# The PEP is the coaz-pep service from the base compose (vendored from the
# authzen-coaz-pep package): agentgateway attaches it via the Envoy-compatible
# extAuthz policy (gRPC :9191), while Kong uses its HTTP check API (:9192).
# Both include COAZ (OpenID AuthZEN MCP profile) support for tools/call.

services:
  # Park Kong: only started if you explicitly ask for --profile kong.
  kong:
    profiles: ["kong"]

  # The gateway itself, on the same host port Kong used (8002).
  agentgateway:
    build: ./agentgateway
    environment:
      BANK_MCP_HOST: "bank-mcp:8090"
      BANK_API_HOST: "bank-api:8070"
      EXTAUTHZ_HOST: "coaz-pep:9191"
    ports:
      - "8002:8000"
    depends_on:
      - coaz-pep
      - bank-api
      - bank-mcp

  # Repoint the governed hops at agentgateway.
  bank-mcp:
    environment:
      BANK_API_BASE_URL: "http://agentgateway:8000/bank"

  bank-agent:
    environment:
      MCP_SERVER_URL: "http://agentgateway:8000/mcp"
    depends_on: !override
      - agentgateway
