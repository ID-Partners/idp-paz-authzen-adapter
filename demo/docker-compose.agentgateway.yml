# Gateway swap: run the demo with agentgateway (solo.io) instead of Kong.
#
#   docker compose -f docker-compose.yml -f docker-compose.agentgateway.yml up --build
#
# Same topology, same PDP — only the gateway (and its PEP implementation) changes:
#   bank-agent ──DPoP──▶ agentgateway:/mcp  (PEP #1) ──▶ bank-mcp
#   bank-mcp   ──token─▶ agentgateway:/bank (PEP #2) ──▶ bank-api
#   both PEPs ──ext_authz(gRPC)──▶ authzen-extauthz ──AuthZEN──▶ authzen-adapter ──▶ Ping Authorize
#
# Where Kong runs the authzen-pdp Lua plugin in-process, agentgateway attaches
# its Envoy-compatible extAuthz policy to each route, calling the
# authzen-extauthz extension (demo/agentgateway/authzen-ext) — a gRPC bridge
# that ports the same PEP logic and consumes the same AuthZEN PDP.

services:
  # Park Kong: only started if you explicitly ask for --profile kong.
  kong:
    profiles: ["kong"]

  # The AuthZEN PEP extension (Envoy ext_authz gRPC -> AuthZEN PDP).
  authzen-extauthz:
    build: ./agentgateway/authzen-ext
    environment:
      PORT: "9191"
      AUTHZEN_URL: "http://authzen-adapter:8080"
      AUTHZEN_API_KEY: "${AUTHZEN_API_KEY:-Password1}"
    expose:
      - "9191"
    depends_on:
      - authzen-adapter

  # The gateway itself, on the same host port Kong used (8002).
  agentgateway:
    build: ./agentgateway
    environment:
      BANK_MCP_HOST: "bank-mcp:8090"
      BANK_API_HOST: "bank-api:8070"
      EXTAUTHZ_HOST: "authzen-extauthz:9191"
    ports:
      - "8002:8000"
    depends_on:
      - authzen-extauthz
      - bank-api
      - bank-mcp

  # Repoint the governed hops at agentgateway.
  bank-mcp:
    environment:
      BANK_API_BASE_URL: "http://agentgateway:8000/bank"

  bank-agent:
    environment:
      MCP_SERVER_URL: "http://agentgateway:8000/mcp"
    depends_on: !override
      - agentgateway
