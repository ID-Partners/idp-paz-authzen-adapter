# Local run of the full demo stack.
#   docker compose up --build
# Then open http://localhost:8000
#
# Set ANTHROPIC_API_KEY in your shell (or a .env file next to this compose file).
# Point the AuthZEN adapter at your Ping Authorize with PDP_URL / PDP_SECRET.
#
# Topology (two policy-enforcement points on one Kong gateway):
#   bank-agent ──DPoP──▶ kong:/mcp  (PEP #1) ──▶ bank-mcp
#   bank-mcp   ──token─▶ kong:/bank (PEP #2) ──▶ bank-api
#   both PEPs ──AuthZEN──▶ authzen-adapter ──▶ Ping Authorize

services:
  authzen-adapter:
    build: ../authzen-adapter
    environment:
      PORT: "8080"
      API_KEY: "${AUTHZEN_API_KEY:-Password1}"
      PDP_DOMAIN_PREFIX: "idpartners"
      PDP_ATTRIBUTE_PREFIX: "AuthZEN"
      PDP_SERVICE: "AuthZEN"
      PDP_ACTION: "authorize"
      PDP_URL: "${PDP_URL:-https://host.docker.internal:1443/governance-engine}"
      QUERY_URL: "${QUERY_URL:-https://host.docker.internal:1443/governance-engine/query}"
      PDP_SECRET_HEADER: "${PDP_SECRET_HEADER:-CLIENT_TOKEN}"
      PDP_SECRET: "${PDP_SECRET:-2FederateM0re}"
    ports:
      - "8080:8080"

  bank-api:
    build: ./bank-api
    environment:
      PORT: "8070"
    expose:
      - "8070"

  kong:
    build: ./kong
    environment:
      # consumed by the authzen-pdp plugin via Kong's env vault
      AUTHZEN_URL: "http://authzen-adapter:8080"
      AUTHZEN_API_KEY: "${AUTHZEN_API_KEY:-Password1}"
    ports:
      - "8002:8000"   # proxy on host:8002 (agent/mcp reach it internally as kong:8000)
      - "8001:8001"   # admin (debug only)
    depends_on:
      - authzen-adapter
      - bank-api
      - bank-mcp

  bank-mcp:
    build: ./mcp-server
    environment:
      PORT: "8090"
      # MCP tools call the Bank API through Kong (PEP #2)
      BANK_API_BASE_URL: "http://kong:8000/bank"
      AGENT_ID: "urn:agent:northwind-onboarding:v1"
    expose:
      - "8090"

  bank-agent:
    build: ./agent
    environment:
      PORT: "8000"
      # agent connects to the MCP service through Kong (PEP #1)
      MCP_SERVER_URL: "http://kong:8000/mcp"
      # identity / token exchange
      TOKEN_MODE: "${TOKEN_MODE:-local}"
      OIDC_ISSUER: "${OIDC_ISSUER:-https://pingfederate-production.up.railway.app}"
      AGENT_ID: "urn:agent:northwind-onboarding:v1"
      AGENT_CLIENT_ID: "${AGENT_CLIENT_ID:-bank-agent}"
      AGENT_CLIENT_SECRET: "${AGENT_CLIENT_SECRET:-}"
      PRINCIPAL_SUB: "alice"
      RS_AUDIENCE: "${RS_AUDIENCE:-https://api.northwind.example/bank}"
      # model
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-sonnet-5}"
    ports:
      - "8000:8000"
    depends_on:
      - kong
