<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ID Partners app icon: full-bleed orange (iOS applies the rounded mask), white iDP mark. -->
  <rect width="1024" height="1024" fill="#FF6600"/>
  <g fill="#FFFFFF">
    <!-- lowercase "i": square dot over a stem -->
    <rect x="300" y="392" width="70" height="70" rx="10"/>
    <rect x="300" y="486" width="70" height="146" rx="6"/>
    <!-- "D" and "P" as heavy geometric caps -->
    <text x="392" y="632" font-family="Helvetica Neue, Arial, sans-serif"
          font-weight="800" font-size="300" letter-spacing="-6">DP</text>
  </g>
</svg>
